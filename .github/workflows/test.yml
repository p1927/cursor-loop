name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m pytest tests/test_loop_hook_lib.py -q
      - name: Smoke tests
        run: bash tests/smoke_hooks.sh && bash tests/smoke_install.sh && bash tests/smoke_minimal_example.sh
